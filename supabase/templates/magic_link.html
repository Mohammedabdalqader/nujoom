<!doctype html>
<html lang="ar" dir="rtl">
  <body style="margin:0;padding:0;background:#06120c;font-family:Tahoma,Arial,sans-serif;color:#f2f7ee;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#06120c;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#0d2117;border-radius:20px;border:1px solid #1f3a2b;">
            <tr>
              <td style="padding:28px 28px 8px;font-size:22px;font-weight:bold;color:#ffc83d;">★ نجوم الحارة</td>
            </tr>
            <tr>
              <td style="padding:8px 28px;font-size:18px;line-height:1.7;">رمز الدخول تبعك:</td>
            </tr>
            <tr>
              <td style="padding:8px 28px 20px;">
                <div dir="ltr" style="font-size:40px;letter-spacing:10px;font-weight:bold;color:#b8f23a;text-align:center;background:#06120c;border-radius:14px;padding:16px 0;">{{ .Token }}</div>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:0 28px 24px;">
                <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email&next={{ .RedirectTo }}"
                   style="display:inline-block;background:#b8f23a;color:#06120c;font-weight:bold;font-size:16px;text-decoration:none;padding:14px 28px;border-radius:999px;">
                  دخول من المتصفح
                </a>
              </td>
            </tr>
            <tr>
              <td dir="ltr" style="padding:16px 28px 28px;border-top:1px solid #1f3a2b;font-size:14px;line-height:1.6;color:#a9bdb0;text-align:left;">
                Your Nujoom al-Hara sign-in code is <strong style="color:#b8f23a;">{{ .Token }}</strong>.
                It expires in one hour. If you didn't ask for it, ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
